# Cyan Arcade: the whole stack.
#
#   docker compose up --build        the app on http://localhost:3000
#   docker compose up -d postgres    only the database, for running the backend and frontend natively
#
# Every setting has a working default; copy .env.example to .env to change them.
name: cyan-arcade

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cyan_arcade}
      POSTGRES_USER: ${DB_USERNAME:-cyan}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cyan}
    ports:
      # Only this machine can reach it. Port 5433 avoids a locally installed PostgreSQL on 5432.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18+ images keep their data in a version-specific subdirectory of /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-cyan_arcade}
      DB_USERNAME: ${DB_USERNAME:-cyan}
      DB_PASSWORD: ${DB_PASSWORD:-cyan}
      # Set to true when the site is served over HTTPS.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Leave forwarding off until the backend-facing nginx IP is explicitly trusted.
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
      TRUSTED_PROXY_REGEX: ${TRUSTED_PROXY_REGEX:-(?!)}
      REGISTRATION_MAX_REQUESTS: ${REGISTRATION_MAX_REQUESTS:-5}
      REGISTRATION_REQUEST_WINDOW: ${REGISTRATION_REQUEST_WINDOW:-1h}
      LOGIN_MAX_REQUESTS: ${LOGIN_MAX_REQUESTS:-30}
      LOGIN_REQUEST_WINDOW: ${LOGIN_REQUEST_WINDOW:-1m}
      GAME_SESSION_MAX_REQUESTS: ${GAME_SESSION_MAX_REQUESTS:-60}
      GAME_SESSION_REQUEST_WINDOW: ${GAME_SESSION_REQUEST_WINDOW:-1m}
      TCG_DAILY_PACK_LIMIT: ${TCG_DAILY_PACK_LIMIT:-10}
      # Opt in with both credentials to create an admin. Existing accounts are never changed.
      ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Stockfish (built into the image): engine processes, threads and hash (MB) each, hints per
      # game for players, and engine requests per account a minute. See README, Chess engine.
      STOCKFISH_POOL_SIZE: ${STOCKFISH_POOL_SIZE:-2}
      STOCKFISH_THREADS: ${STOCKFISH_THREADS:-1}
      STOCKFISH_HASH_MB: ${STOCKFISH_HASH_MB:-32}
      CHESS_HINTS_PER_GAME: ${CHESS_HINTS_PER_GAME:-3}
      CHESS_ENGINE_REQUESTS_PER_MINUTE: ${CHESS_ENGINE_REQUESTS_PER_MINUTE:-30}
    ports:
      # For development tools only (the Vite dev server, curl). The browser goes through the frontend.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db-data:
