spring:
  application:
    name: cyan-arcade-backend
  autoconfigure:
    # No in-memory default user: authentication is provided by the auth feature, not by Boot.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/cyan_arcade}
    username: ${DB_USERNAME:cyan}
    password: ${DB_PASSWORD:cyan}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only verifies that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      # How long a player stays signed in without visiting.
      timeout: 14d
      cookie:
        name: CYAN_SESSION
        http-only: true
        same-site: lax
        # Set to true wherever the site is served over HTTPS.
        secure: ${SESSION_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Cyan Arcade
    version: '@project.version@'

app:
  admin:
    # At startup, creates the admin account (role ADMIN) when no account has this username. Never
    # changes an existing account. The defaults are for development and demos only: set your own
    # ADMIN_USERNAME and ADMIN_PASSWORD wherever the arcade is reachable by others.
    seed: ${ADMIN_SEED_ENABLED:true}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:11112002}
  auth:
    login:
      # Failed logins allowed per username and address before further attempts are refused,
      # and how long a failure is remembered.
      max-failures: ${LOGIN_MAX_FAILURES:5}
      window: ${LOGIN_FAILURE_WINDOW:5m}
  game-sessions:
    # A run still unfinished after this long is removed by an hourly job.
    abandoned-after: ${GAME_SESSIONS_ABANDONED_AFTER:24h}
  scheduling:
    # Switches every scheduled job on or off.
    enabled: ${SCHEDULING_ENABLED:true}
  daily-challenges:
    # Creates each day's challenges at startup and at midnight UTC. Turn off to manage them by hand.
    generation-enabled: ${DAILY_CHALLENGES_GENERATION_ENABLED:true}
  rewards:
    # Coins for finishing a game, and extra for beating your own best score. Achievements and daily
    # challenges carry their own amounts. Only the first rewarded-games-per-day games of a day (UTC)
    # pay game-completed-coins, so very short runs cannot be farmed.
    game-completed-coins: ${REWARDS_GAME_COMPLETED_COINS:5}
    personal-best-coins: ${REWARDS_PERSONAL_BEST_COINS:15}
    rewarded-games-per-day: ${REWARDS_GAMES_PER_DAY:40}
    rewarded-personal-bests-per-day: ${REWARDS_PERSONAL_BESTS_PER_DAY:10}
  daily-login:
    # Coins for each day in a row a player claims the daily reward (one claim per UTC day). After the
    # last day the streak starts over; the last day also gives bonus-item (a shop item code).
    rewards: ${DAILY_LOGIN_REWARDS:50,60,70,80,100,125,200}
    bonus-item: ${DAILY_LOGIN_BONUS_ITEM:EXTRA_PACK}
    bonus-item-units: 1
  tcg:
    # Packs one player may open per day (UTC). 0 means no limit.
    daily-pack-limit: ${TCG_DAILY_PACK_LIMIT:10}
    import:
      # Card game sources to import from at startup, comma-separated (pokemon, one-piece). Empty for
      # an ordinary start: the arcade then serves what was imported before and never calls a source.
      # The import-tcg profile sets this and exits when done.
      sources: ${TCG_IMPORT_SOURCES:}
      # Comma-separated paths of dataset files (the arcade's own JSON format) to import at startup.
      files: ${TCG_IMPORT_FILES:}
      exit-when-done: false
    sources:
      pokemon:
        # TCGdex's GraphQL API, and which sets to take and how their packs are made up.
        url: ${TCG_POKEMON_URL:https://api.tcgdex.net/v2/graphql}
        config: ${TCG_POKEMON_CONFIG:classpath:tcg/sources/pokemon.json}
      one-piece:
        # OPTCG API, a free public API for the English One Piece Card Game.
        url: ${TCG_ONE_PIECE_URL:https://optcgapi.com/api}
        config: ${TCG_ONE_PIECE_CONFIG:classpath:tcg/sources/one-piece.json}
  cors:
    # Comma-separated origins allowed to call the API directly from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
