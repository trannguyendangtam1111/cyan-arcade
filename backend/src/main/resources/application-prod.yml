# Render only: activate explicitly with SPRING_PROFILES_ACTIVE=prod.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 0
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 60000
      max-lifetime: 240000
      data-source-properties:
        sslmode: require
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    clean-disabled: true

server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  # Cookies are explicitly secure; no client-supplied forwarding header is trusted.
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: lax
        path: /
  tomcat:
    threads:
      max: 24
      min-spare: 2
    max-connections: 128
    accept-count: 32

management:
  endpoint:
    health:
      show-details: never
      group:
        readiness:
          include: readinessState,db

app:
  admin:
    seed: ${ADMIN_SEED_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  tcg:
    import:
      sources: ""
      files: ""
      exit-when-done: false
  chess:
    engine:
      pool-size: ${STOCKFISH_POOL_SIZE:1}
      threads: ${STOCKFISH_THREADS:1}
      hash-mb: ${STOCKFISH_HASH_MB:8}
      max-waiting: 2
      ready-timeout: 60s
    review:
      concurrent: 1
      queue: 1
    cache:
      max-entries: 256
