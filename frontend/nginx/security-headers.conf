# Security headers for everything nginx serves itself (the app and its files). API responses get
# theirs from Spring Security. Included in each location, because a location that sets any header
# of its own no longer inherits the server's.

# Scripts, styles, fonts and API calls come from this site only. Images may also come from other
# HTTPS hosts, for card games whose card art is hosted elsewhere. Inline styles are allowed because
# React sets per-element style attributes (a game's accent color, a progress bar's width).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
