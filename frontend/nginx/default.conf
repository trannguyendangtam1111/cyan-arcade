# Serves the SPA and proxies API calls to Spring Boot, so the browser sees a single origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The API takes small JSON bodies only.
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Forward the host exactly as the browser sent it, including the port ($http_host, not $host).
    # Browsers add an Origin header to POST requests; the backend compares it with the Host header
    # to tell same-origin requests from cross-origin ones. If the port were dropped here, every POST
    # from this very site would look cross-origin and be rejected with 403.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only the health endpoint is useful from outside; everything else of Actuator stays internal.
    location = /actuator/health {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    location /actuator/ {
        return 404;
    }

    # Fingerprinted build output can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Game thumbnails and card art keep their names across releases, so they are cached for a day.
    location ~ ^/(thumbnails|tcg-assets)/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Client-side routing: unknown paths fall back to the SPA shell, which is never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
